<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><link rel="icon" href="data:,"></head><body>
<title>The Capitol Steps — An 1835 Investigation</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap');

:root {
  --ink: #241e22;
  --paper: #e8dcc4;
  --paper-dark: #d6c4a0;
  --gold: #d0a448;
  --red: #962428;
  --font-body: "Libre Baskerville", Georgia, "Times New Roman", serif;
  --font-display: "IM Fell English", "Libre Baskerville", Georgia, serif;
}

html, body {
  margin: 0; padding: 0; height: 100%;
  background: #121013;
  overflow: hidden;
  font-family: var(--font-body);
  color: var(--paper);
  user-select: none;
  -webkit-user-select: none;
}

#stage {
  position: absolute; left: 0; top: 0;
  width: 640px; height: 360px;
  transform-origin: top left;
}
#game {
  position: absolute; left: 0; top: 0;
  width: 640px; height: 360px;
  image-rendering: pixelated;
  image-rendering: crisp-edges;
  background: #121013;
}
#overlay {
  position: absolute; left: 0; top: 0; width: 100%; height: 100%;
  pointer-events: none;
}
#overlay > * { pointer-events: auto; }
.hidden { display: none !important; }
img.px { image-rendering: pixelated; image-rendering: crisp-edges; }

/* ---------- HUD ---------- */
#hud {
  position: absolute; left: 0; top: 0; width: 100%; height: 40px;
  display: flex; align-items: flex-start; gap: 6px; padding: 5px 6px; box-sizing: border-box;
  pointer-events: none;
}
#hud > * { pointer-events: auto; }
#suspects { display: flex; gap: 3px; }
#suspects .sus {
  width: 32px; height: 32px; border: 2px solid #3a3034; border-radius: 3px;
  background: #1c181a; overflow: hidden; position: relative; opacity: .55;
  filter: grayscale(1);
}
#suspects .sus img { width: 32px; height: 32px; display: block; image-rendering: pixelated; }
#suspects .sus.done { opacity: 1; filter: none; border-color: var(--gold); }
#suspects .sus.done::after {
  content: ""; position: absolute; right: -1px; bottom: -1px; width: 8px; height: 8px;
  background: var(--gold); border-top-left-radius: 3px;
}
#evidence-btn, #help-btn {
  margin-left: auto; height: 26px; min-width: 40px; padding: 0 8px;
  background: #1c181a; border: 2px solid #3a3034; color: var(--paper); border-radius: 3px;
  font-family: var(--font-body); font-size: 12px; cursor: pointer; display: flex; align-items: center; gap: 5px;
}
#help-btn { margin-left: 0; min-width: 26px; padding: 0; justify-content: center; font-weight: bold; }
#evidence-btn:hover, #help-btn:hover { border-color: var(--gold); }
#evidence-btn .icon {
  width: 14px; height: 10px; background: var(--paper-dark); border: 1px solid var(--ink);
  box-shadow: inset 0 3px 0 var(--red);
}
#evidence-btn.flash { animation: flash .6s 3; }
@keyframes flash { 50% { border-color: var(--gold); background: #4a3a20; } }

#location-banner {
  position: absolute; left: 50%; top: 12px; transform: translateX(-50%);
  font-family: var(--font-display); font-size: 15px; letter-spacing: 1px;
  color: var(--paper); text-shadow: 0 1px 0 #000, 0 0 6px #000;
  opacity: 0; transition: opacity .4s; pointer-events: none;
}
#location-banner.show { opacity: 1; }

#toast {
  position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
  background: rgba(20,16,18,.92); border: 1px solid #5a4a30; color: var(--paper);
  padding: 4px 10px; font-size: 10px; border-radius: 3px; opacity: 0; transition: opacity .3s;
  pointer-events: none; white-space: nowrap;
}
#toast.show { opacity: 1; }

/* ---------- Dialogue ---------- */
#dialogue {
  position: absolute; left: 8px; right: 8px; bottom: 8px; height: 148px;
  background: linear-gradient(#2a2226, #1a1518);
  border: 2px solid #6a5636; border-radius: 4px;
  box-shadow: 0 0 0 2px #121013, 0 4px 12px rgba(0,0,0,.6);
  display: flex; gap: 8px; padding: 6px; box-sizing: border-box;
}
#dlg-portrait {
  width: 128px; height: 128px; flex: none; border: 2px solid #3a3034; background: #000;
  image-rendering: pixelated;
}
#dlg-portrait img { width: 128px; height: 128px; display: block; image-rendering: pixelated; }
#dlg-portrait.player { background: #3a3034 center / 48px no-repeat; }
#dlg-body { flex: 1; display: flex; flex-direction: column; min-width: 0; position: relative; }
#dlg-name {
  font-family: var(--font-display); font-size: 12px; color: var(--gold); letter-spacing: .5px;
  margin-bottom: 2px;
}
#dlg-text {
  font-size: 11.5px; line-height: 1.45; color: var(--paper); flex: 1; overflow: hidden;
}
#dlg-text .term { border-bottom: 1px dotted var(--gold); color: #f0dfa8; cursor: help; position: relative; }
#dlg-text .term:hover::after {
  content: attr(data-def); position: absolute; left: 0; bottom: 110%; width: 220px;
  background: #0f0c0e; border: 1px solid var(--gold); color: var(--paper); padding: 4px 6px;
  font-size: 9.5px; line-height: 1.35; z-index: 5; font-style: normal;
}
#dlg-choices { display: grid; grid-template-columns: 1fr 1fr; gap: 1px 10px; margin-top: 2px; }
#dlg-choices button {
  text-align: left; background: transparent; border: 1px solid transparent; color: var(--paper);
  font-family: var(--font-body); font-size: 10.5px; padding: 1px 6px; cursor: pointer; border-radius: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#dlg-choices button::before { content: "▸ "; color: var(--gold); }
#dlg-choices button:hover, #dlg-choices button.sel { background: #3a2c20; border-color: #6a5636; }
#dlg-choices button.evidence::before { content: "☐ "; }
#dlg-choices button.leave { color: #b8a890; }
#dlg-hint { position: absolute; right: 2px; bottom: 0; font-size: 8.5px; color: #8a7a60; font-style: italic; }
#dlg-hint.hidden { display: none; }

/* ---------- Evidence tray ---------- */
#tray {
  position: absolute; inset: 0; background: rgba(8,6,8,.72); display: flex; align-items: center; justify-content: center;
}
.panel {
  width: 560px; height: 300px; background: var(--paper); color: var(--ink);
  border: 3px solid #6a5636; box-shadow: 0 0 0 2px #121013, 0 6px 20px rgba(0,0,0,.7);
  display: flex; flex-direction: column; box-sizing: border-box;
  background-image: radial-gradient(rgba(0,0,0,.05) 1px, transparent 1px);
  background-size: 6px 6px;
}
.panel-head {
  display: flex; align-items: center; padding: 4px 10px; border-bottom: 2px solid #a08a5a;
  font-family: var(--font-display); font-size: 14px; letter-spacing: 1px;
}
.panel-head .close {
  margin-left: auto; background: transparent; border: 1px solid #6a5636; color: var(--ink);
  width: 20px; height: 20px; cursor: pointer; font-size: 14px; line-height: 1;
}
#tray-grid {
  display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 10px; align-content: flex-start;
}
#tray-grid .slot {
  width: 72px; height: 72px; border: 2px dashed #b09a6a; display: flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,.25); cursor: pointer; box-sizing: border-box;
}
#tray-grid .slot.filled { border-style: solid; border-color: #6a5636; background: #f3ead6; }
#tray-grid .slot.filled:hover, #tray-grid .slot.sel { outline: 2px solid var(--red); }
#tray-grid .slot img { width: 64px; height: 64px; image-rendering: pixelated; }
#tray-detail {
  margin: 0 10px 8px; padding: 6px 8px; border-top: 1px solid #b09a6a; min-height: 60px;
  font-size: 10.5px; line-height: 1.4;
}
#tray-detail b { font-family: var(--font-display); font-size: 12px; }
#tray-detail .where { color: #6a5636; font-style: italic; }
#tray-detail .tier { display: inline-block; font-size: 9px; padding: 0 5px; border: 1px solid #6a5636; margin-left: 6px; }

/* ---------- Evidence card pop ---------- */
#card-pop {
  position: absolute; inset: 0; background: rgba(8,6,8,.6); display: flex; align-items: center; justify-content: center;
  cursor: pointer;
}
#card-pop .card {
  width: 270px; background: var(--paper); color: var(--ink); border: 3px solid #6a5636;
  box-shadow: 0 0 0 2px #121013, 0 6px 20px rgba(0,0,0,.7); padding: 10px 12px; box-sizing: border-box;
  text-align: center; animation: pop .25s ease-out;
}
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.card-art { width: 128px; height: 128px; margin: 0 auto 6px; background: #f3ead6; border: 2px solid #6a5636; }
.card-art img { width: 128px; height: 128px; image-rendering: pixelated; display: block; }
.card-title { font-family: var(--font-display); font-size: 15px; }
.card-where { font-size: 9.5px; color: #6a5636; font-style: italic; margin-bottom: 4px; }
.card-desc { font-size: 10.5px; line-height: 1.4; text-align: left; }
.card-hint { font-size: 9px; color: var(--red); margin-top: 6px; font-weight: bold; letter-spacing: .5px; }

/* ---------- Fullscreen scenes ---------- */
#fullscreen {
  position: absolute; inset: 0; background: #121013; color: var(--paper);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
}
.scene { width: 100%; height: 100%; position: relative; overflow: hidden; }
.scene .bg { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); image-rendering: pixelated; min-width: 100%; min-height: 100%; }
.scene .bg img { image-rendering: pixelated; position: absolute; }
.scene .text {
  position: absolute; left: 40px; right: 40px; bottom: 30px;
  background: rgba(14,10,12,.86); border: 2px solid #6a5636; padding: 10px 14px;
  font-size: 12px; line-height: 1.5;
}
.scene .text .cont { display: block; text-align: right; font-size: 9px; color: #8a7a60; font-style: italic; margin-top: 6px; }
.scene h1 {
  font-family: var(--font-display); font-weight: normal; font-size: 34px; letter-spacing: 2px; margin: 0;
  text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.8);
}
.scene h2 { font-family: var(--font-display); font-weight: normal; font-size: 16px; letter-spacing: 3px; color: var(--gold); margin: 4px 0 0; }
.scene .center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.btn {
  background: #2a2226; border: 2px solid var(--gold); color: var(--paper); font-family: var(--font-display);
  font-size: 14px; letter-spacing: 1px; padding: 6px 18px; cursor: pointer; margin-top: 16px;
}
.btn:hover { background: #4a3a20; }
.btn.small { font-size: 11px; padding: 3px 10px; margin-top: 8px; }
.btn[disabled] { opacity: .4; cursor: default; }

/* briefing dossiers */
.dossiers { position: absolute; left: 20px; top: 20px; right: 20px; bottom: 20px; display: flex; gap: 8px; }
.dossier-list { width: 150px; display: flex; flex-direction: column; gap: 4px; }
.dossier-list button {
  display: flex; align-items: center; gap: 6px; background: var(--paper-dark); color: var(--ink);
  border: 2px solid #6a5636; padding: 3px; cursor: pointer; font-family: var(--font-display); font-size: 12px; text-align: left;
}
.dossier-list button img { width: 32px; height: 32px; image-rendering: pixelated; }
.dossier-list button.sel { background: var(--paper); border-color: var(--red); }
.dossier-list button.read::after { content: "✓"; margin-left: auto; color: var(--red); }
.dossier {
  flex: 1; background: var(--paper); color: var(--ink); border: 3px solid #6a5636; padding: 10px 14px; box-sizing: border-box;
  display: flex; gap: 12px; position: relative;
  background-image: radial-gradient(rgba(0,0,0,.05) 1px, transparent 1px); background-size: 6px 6px;
}
.dossier img.big { width: 128px; height: 128px; image-rendering: pixelated; border: 2px solid #6a5636; flex: none; }
.dossier .body { font-size: 10.5px; line-height: 1.45; overflow: auto; }
.dossier h3 { font-family: var(--font-display); font-weight: normal; font-size: 18px; margin: 0 0 2px; }
.dossier .meta { font-size: 9.5px; color: #6a5636; font-style: italic; margin-bottom: 6px; }
.dossier .grudge { border-left: 3px solid var(--red); padding-left: 8px; margin-top: 6px; font-style: italic; }
.dossier .stamp {
  position: absolute; right: 14px; top: 10px; border: 2px solid var(--red); color: var(--red);
  font-family: var(--font-display); font-size: 11px; padding: 1px 6px; transform: rotate(8deg); letter-spacing: 2px; opacity: .8;
}

/* trial */
.court { position: absolute; inset: 0; display: flex; flex-direction: column; }
.court .bench {
  height: 130px; background: linear-gradient(#3a2a1c, #2a1c12); border-bottom: 4px solid #6a5636;
  display: flex; align-items: flex-end; justify-content: center; gap: 24px; padding-bottom: 8px; position: relative;
}
.court .bench .who { display: flex; flex-direction: column; align-items: center; font-family: var(--font-display); font-size: 10px; color: var(--gold); }
.court .bench .who img { width: 64px; height: 64px; image-rendering: pixelated; border: 2px solid #6a5636; background: #000; }
.court .bench .who.accused img { border-color: var(--red); }
.court .jury { position: absolute; right: 12px; top: 10px; font-size: 9px; color: var(--paper-dark); text-align: right; width: 150px; }
.court .jury .meter { height: 8px; border: 1px solid #6a5636; background: #1a1418; margin-top: 3px; }
.court .jury .meter i { display: block; height: 100%; background: var(--gold); width: 10%; transition: width .5s; }
.court .floor { flex: 1; display: flex; flex-direction: column; padding: 8px 14px; box-sizing: border-box; }
.court .speech { font-size: 11.5px; line-height: 1.45; min-height: 64px; }
.court .speech b { color: var(--gold); font-family: var(--font-display); font-weight: normal; }
.court .rack { display: flex; gap: 6px; margin-top: auto; flex-wrap: wrap; }
.court .rack .slot { width: 52px; height: 52px; border: 2px solid #6a5636; background: var(--paper); cursor: pointer; box-sizing: border-box; }
.court .rack .slot img { width: 48px; height: 48px; image-rendering: pixelated; }
.court .rack .slot:hover { outline: 2px solid var(--gold); }
.court .rack .slot.used { opacity: .3; pointer-events: none; }

/* epilogue */
.epilogue {
  position: absolute; left: 40px; right: 40px; top: 16px; bottom: 16px; font-size: 10.5px; line-height: 1.5; overflow: auto;
  background: rgba(14,10,12,.88); border: 2px solid #6a5636; padding: 10px 16px; box-sizing: border-box;
}
.epilogue h2 { margin: 0 0 8px; }
.epilogue p { margin: 0 0 7px; }
.epilogue .term { border-bottom: 1px dotted var(--gold); color: #f0dfa8; }
.epilogue .fact { border-left: 3px solid var(--gold); padding-left: 10px; }

/* help */
.help { position: absolute; inset: 40px 80px; background: var(--paper); color: var(--ink); border: 3px solid #6a5636; padding: 12px 16px; font-size: 11px; line-height: 1.5; box-sizing: border-box; }
.help h3 { font-family: var(--font-display); font-weight: normal; margin: 0 0 6px; font-size: 16px; }
.help kbd { background: #fff; border: 1px solid #6a5636; padding: 0 4px; font-family: inherit; font-size: 10px; }

/* ---------- Touch controls ---------- */
#touch { position: absolute; inset: 0; pointer-events: none; }
#touch button {
  pointer-events: auto; touch-action: none; -webkit-tap-highlight-color: transparent;
  background: rgba(30,24,28,.55); border: 2px solid rgba(208,164,72,.55); color: rgba(232,220,196,.9);
  font-family: var(--font-display); font-size: 16px; border-radius: 8px; padding: 0; cursor: pointer;
}
#touch button.on { background: rgba(208,164,72,.45); }
#dpad { position: absolute; left: 10px; bottom: 10px; width: 108px; height: 108px; display: grid; grid-template-columns: 36px 36px 36px; grid-template-rows: 36px 36px 36px; }
#dpad button[data-d="up"] { grid-column: 2; grid-row: 1; }
#dpad button[data-d="left"] { grid-column: 1; grid-row: 2; }
#dpad button[data-d="right"] { grid-column: 3; grid-row: 2; }
#dpad button[data-d="down"] { grid-column: 2; grid-row: 3; }
#btn-a { position: absolute; right: 14px; bottom: 18px; width: 64px; height: 64px; border-radius: 50% !important; font-size: 13px !important; letter-spacing: 1px; }
body.touch #dlg-hint { display: none; }
body.touch #dlg-choices button { padding: 4px 6px; }
body.touch #dialogue { height: 152px; }
#rotate { position: absolute; inset: 0; background: #121013; color: var(--paper); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-size: 22px; text-align: center; z-index: 50; }
/* tappable glossary */
#dlg-text .term.open::after {
  content: attr(data-def); position: absolute; left: 0; bottom: 110%; width: 220px;
  background: #0f0c0e; border: 1px solid var(--gold); color: var(--paper); padding: 4px 6px;
  font-size: 9.5px; line-height: 1.35; z-index: 5; font-style: normal;
}

</style>
<div id="stage">
  <canvas id="game" width="640" height="360"></canvas>
  <div id="overlay">
    <div id="hud">
      <div id="suspects" title="Suspects interviewed"></div>
      <button id="evidence-btn" title="Evidence (Tab)"><span class="icon"></span><span id="evidence-count">0</span></button>
      <button id="help-btn" title="Help">?</button>
    </div>
    <div id="location-banner"></div>
    <div id="toast"></div>
    <div id="dialogue" class="hidden">
      <div id="dlg-portrait"></div>
      <div id="dlg-body">
        <div id="dlg-name"></div>
        <div id="dlg-text"></div>
        <div id="dlg-choices"></div>
        <div id="dlg-hint">Space / click to continue</div>
      </div>
    </div>
    <div id="tray" class="hidden">
      <div class="panel">
        <div class="panel-head"><span id="tray-title">Evidence</span><button class="close" id="tray-close">×</button></div>
        <div id="tray-grid"></div>
        <div id="tray-detail"></div>
      </div>
    </div>
    <div id="card-pop" class="hidden">
      <div class="card">
        <div class="card-art"></div>
        <div class="card-title"></div>
        <div class="card-where"></div>
        <div class="card-desc"></div>
        <div class="card-hint">Write this down. Click to continue.</div>
      </div>
    </div>
    <div id="fullscreen" class="hidden"></div>
    <div id="touch" class="hidden">
      <div id="dpad"><button data-d="up">▲</button><button data-d="left">◀</button><button data-d="right">▶</button><button data-d="down">▼</button></div>
      <button id="btn-a">TALK</button>
    </div>
    <div id="rotate" class="hidden"><div>Turn your device sideways to play</div></div>

/* Room definitions: the street and every interior. Tile coordinates throughout. */
'use strict';

const ROOMS = {};

// --- helpers ---------------------------------------------------------------
function grid(w, h, ch) { return Array.from({ length: h }, () => ch.repeat(w)); }
function paint(g, x, y, w, h, ch) {
  for (let j = y; j < y + h; j++) {
    if (j < 0 || j >= g.length) continue;
    const row = g[j].split('');
    for (let i = x; i < x + w; i++) if (i >= 0 && i < row.length) row[i] = ch;
    g[j] = row.join('');
  }
}
function scatter(g, ch, coords) { for (const [x, y] of coords) paint(g, x, y, 1, 1, ch); }

/* Standard interior: a cornice row, a two-tile wall (field + wainscot) with tall windows and
   doors, side walls, a bottom wall lip with an exit gap, floor between. Rooms are 20x12 by
   default so they fill the view. */
function interior(id, o) {
  const w = o.w || 20, h = o.h || 12;
  const g = grid(w, h, 'f');
  paint(g, 0, 0, w, 1, o.beams ? 'C' : 'T');
  paint(g, 0, 1, w, 1, 'W');
  paint(g, 0, 2, w, 1, 'L');
  for (const wx of (o.windows || [])) { paint(g, wx, 1, 1, 1, 'N'); paint(g, wx, 2, 1, 1, 'n'); }
  for (const dx of (o.doors || [])) { paint(g, dx, 1, 1, 1, 'D'); paint(g, dx, 2, 1, 1, 'd'); }
  paint(g, 0, 0, 1, h, 'S'); paint(g, w - 1, 0, 1, h, 'S');
  paint(g, 1, h - 1, w - 2, 1, 'B');
  const ex = o.exitX != null ? o.exitX : Math.floor(w / 2) - 1;
  if (!o.noExit) paint(g, ex, h - 1, 2, 1, 'f');
  for (const [gx, gy] of (o.gaps || [])) paint(g, gx, gy, 1, 1, 'f');
  const legend = {
    T: 'wall_top', C: 'beam', W: o.wall, L: o.wall + '_lower', N: o.wall + '_win', n: o.wall + '_win_lower',
    D: o.wall + '_door', d: o.wall + '_door_lower', S: 'wall_side', B: 'wall_bottom', f: o.floor, ...(o.legend || {}),
  };
  const objects = [...(o.noExit ? [] : [{ t: 'exit_mat', x: ex, y: h - 1, solid: false, flat: true }, { t: 'exit_mat', x: ex + 1, y: h - 1, solid: false, flat: true }]), ...(o.objects || [])];
  ROOMS[id] = {
    name: o.name, w, h, ground: g, legend, objects, npcs: o.npcs || [], hotspots: o.hotspots || [],
    exits: [...(o.noExit ? [] : [{ x: ex, y: h - 1, w: 2, h: 1, to: o.exitTo || 'street', spawn: o.exitSpawn || ('from_' + (o.building || id)) }]), ...(o.exits || [])],
    spawns: { default: { x: ex, y: h - 2, dir: 'up' }, ...(o.spawns || {}) },
    dim: o.dim, outdoor: false,
  };
  return ROOMS[id];
}

// rug helper: returns flat objects for a rug of w x h tiles at x,y
function rug(colour, x, y, w, h) {
  const out = [];
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) {
    let part = (j === 0 ? 't' : j === h - 1 ? 'b' : '') + (i === 0 ? 'l' : i === w - 1 ? 'r' : '');
    if (!part) part = 'c';
    out.push({ t: `rug_${colour}_${part}`, x: x + i, y: y + j, solid: false, flat: true });
  }
  return out;
}

/* Every conversation in the game. Each entry: { name, portrait, start, nodes, onEvidence }.

const DIALOGUE = {};
function D(id, def) { def.id = id; DIALOGUE[id] = def; return def; }
const met = (S, id) => S.seen[id] && Object.keys(S.seen[id]).length > 0;

D('magistrate', {

  nodes: {
    first: {
      text: [
        "You've read the files. Good. Then you know what I know: five people in this city had reason to want the President dead, and a house painter with two bad pistols nearly did it for them.",
        "Lawrence is in the cells behind me. Start with him. Then the steps at the Capitol — the hat was still lying there when I left. After that, the city is yours.",
        "Bring me *things*, clerk. Not opinions. Everyone in Washington has an opinion. I want evidence, and I want you to be able to say what each piece proves.",
      ],
      set: { mag_first: true }, next: 'hub',
    },
    hub: {
      text: (S) => Game.warrantReady() && !S.flags.trial_done ? "You've spoken to all five and you're carrying a case. Are you ready to name someone?" : "What is it?",
      choices: (S) => [
        { label: 'Remind me what I am looking for.', next: 'remind' },
        { label: 'Where should I go?', next: 'where' },
        { label: 'I am ready to name a conspirator.', next: Game.warrantReady() ? 'accuse' : 'notready', cond: () => !S.flags.trial_done },
        { label: 'Can I see the files again?', next: 'files' },
      ],
      leaveLabel: "I'll get back to work.",
    },
    remind: {
      text: [
        "Lawrence fired the pistols. That's settled — two hundred people saw it. The question is whether anyone *put* him there. A conspiracy needs more than a grudge.",
        "For each suspect, ask yourself three things. Did they have a reason? Did they have the means — money, access, a way to reach a madman? And is there anything I can hold in my hand that connects them to that morning?",
      ], next: 'hub',
    },
    where: {
      text: [
        "The cells are through the bars to your right. The Capitol steps are at the east end of the Avenue; the President's House at the west. The President, by the way, will see you. He sees everyone. He'll tell you who did it before you sit down.",
        "Clay drinks at Gadsby's tavern. Biddle is at the Bank's office. Calhoun lodges at Mrs. Hill's. The Cherokee delegation is at the Indian Queen. Gregory works at the hatter's on the lane. Talk to *everyone* — clerks, keepers, servants. People tell a clerk what they'd never tell me.",
      ], next: 'hub',
    },
    files: {
      text: "The dossiers are in your head, or should be. But every suspect will tell you their own story if you ask — and it will not be the story in my file. Compare them.",
      next: 'hub',
    },
    notready: {
      text: (S) => "Not yet. Before I sign a warrant you must: " + Game.warrantMissing().join('; ') + ". A judge won't hear a case built on half the city.",
      next: 'hub',
    },
    accuse: {
      text: "Very well. Think before you speak. Once you name a man, Mr. Key will put him on trial — and *you* will be the one holding the evidence. Who conspired with Richard Lawrence?",
      choices: (S) => SUSPECTS.map(s => ({ label: s.name, next: 'confirm', fn: (S) => { S.flags._pick = s.id; } })),

    confirm: {
      text: (S) => `${SUSPECT[S.flags._pick].name}. You are certain?`,

        { label: 'No — let me think again.', next: 'accuse' },

    },
    go: {
      text: (S) => `So be it. ${SUSPECT[S.flags._pick].name} will stand before a jury tomorrow. Bring your evidence, and pray it is better than mine was.`,
      fn: (S) => { S.pendingAccuse = S.flags._pick; },
      next: 'END',
    },
  },
});

      text: [
        "I bought them. Good pistols — I tested them in the yard. Both misfired on the steps. The damp, or the devil. I used to paint houses. Then the Bank took the credit away and no one could pay for paint, and I found out I was a king instead.",

      ], set: { hat_not_lawrence: true }, next: 'hub',

    where: {
      text: [
        "In a cell, waiting for a trial. Mr. Key will prosecute me — the man who wrote the song about the flag. They will say I am mad. Perhaps I am.",

      ], next: 'hub',
    },
    ev_hat: { text: "Not mine. I told you. Mine had a red lining and no mark. That is a rich man's hat.", next: 'hub' },

    ev_card: { text: "The Bank. Yes. I wrote to them — many letters, to Philadelphia. They owe me too. Mr. Biddle wrote back once, very politely, that they did not. Everyone lies to a king.", next: 'hub' },
    ev_cards: { text: "I played. I lost. The tall Kentucky gentleman laughed and paid for the whiskey and said the President owed *everyone* money. That was true, at least.", next: 'hub' },
    ev_cartoon: { text: "King Andrew. (He studies it a long time.) Yes. But there cannot be two kings. That is the whole trouble, you see.", next: 'hub' },

D('postmaster', {

      ], next: 'hub',
    },

// ---- src/engine.js ----
/* Core engine: asset loading, input, tile world, entities, camera, rendering.
   Internal resolution is 640x360; the stage is integer-scaled with CSS. */
'use strict';

const TILE = 32;
let VIEW_W = 640, VIEW_H = 360;   // recomputed by fitStage so the game fills the window

// ---------------------------------------------------------------------------
// Assets
// ---------------------------------------------------------------------------
const Assets = {
  images: {}, atlas: null, atlasIndex: null, sprites: {}, buildings: {}, portraits: {}, evidence: {}, ui: {},

  // When bundled into a single file, window.EMBEDDED maps asset paths to data URIs / parsed JSON.
  url(src) { return (window.EMBEDDED && window.EMBEDDED[src]) || src; },
  img(src) {
    return new Promise((res, rej) => {
      const im = new Image();
      im.onload = () => res(im);
      im.onerror = () => rej(new Error('missing ' + src));
      im.src = this.url(src);
    });
  },
  json(src) {
    if (window.EMBEDDED && window.EMBEDDED[src]) return Promise.resolve(window.EMBEDDED[src]);
    return fetch(src).then(r => r.json());
  },

  async load(onProgress) {
    const jobs = [];
    let done = 0, total = 0;
    const track = (p) => { total++; return p.then(v => { done++; onProgress && onProgress(done / total); return v; }); };
    this.atlasIndex = await this.json('assets/tiles/atlas.json');
    this.atlas = await track(this.img('assets/tiles/atlas.png'));
    const spriteIndex = await this.json('assets/sprites/index.json');
    const buildingIndex = await this.json('assets/buildings/index.json');
    const evidenceIndex = await this.json('assets/evidence/index.json');
    for (const n of Object.keys(spriteIndex)) jobs.push(track(this.img(`assets/sprites/${n}.png`)).then(im => { this.sprites[n] = { im, ...spriteIndex[n] }; }));
    for (const n of Object.keys(buildingIndex)) jobs.push(track(this.img(`assets/buildings/${n}.png`)).then(im => { this.buildings[n] = { im, ...buildingIndex[n] }; }));
    for (const n of evidenceIndex) jobs.push(track(this.img(`assets/evidence/${n}.png`)).then(im => { this.evidence[n] = im; }));
    for (const n of ['jackson', 'calhoun', 'clay', 'biddle', 'ross', 'gregory', 'lawrence', 'magistrate', 'key']) jobs.push(track(this.img(`assets/portraits/${n}.png`)).then(im => { this.portraits[n] = im; }));
    for (const n of ['bang', 'arrow', 'spark', 'opening']) jobs.push(track(this.img(`assets/ui/${n}.png`)).then(im => { this.ui[n] = im; }));
    await Promise.all(jobs);
  },

  tile(name) {
    const t = this.atlasIndex[name];
    if (!t) throw new Error('unknown tile ' + name);
    return t;
  },
  drawTile(ctx, name, x, y) {
    const t = this.tile(name);
    ctx.drawImage(this.atlas, t.x, t.y, t.w, t.h, x, y, t.w, t.h);
  },
};

// ---------------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------------
const Input = {
  down: {}, pressedKeys: {}, enabled: true,
  init() {
    window.addEventListener('keydown', e => {
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' ', 'Tab'].includes(e.key)) e.preventDefault();
      if (!this.down[e.key]) this.pressedKeys[e.key] = true;
      this.down[e.key] = true;
    });
    window.addEventListener('keyup', e => { this.down[e.key] = false; });
    window.addEventListener('blur', () => { this.down = {}; });
  },
  touch: { x: 0, y: 0 },
  axis() {
    if (!this.enabled) return { x: 0, y: 0 };
    let x = 0, y = 0;
    if (this.touch.x || this.touch.y) return { x: this.touch.x, y: this.touch.y };
    if (this.down.ArrowLeft || this.down.a || this.down.A) x -= 1;
    if (this.down.ArrowRight || this.down.d || this.down.D) x += 1;
    if (this.down.ArrowUp || this.down.w || this.down.W) y -= 1;
    if (this.down.ArrowDown || this.down.s || this.down.S) y += 1;
    return { x, y };
  },
  pressed(...keys) { return this.enabled && keys.some(k => this.pressedKeys[k]); },
  endFrame() { this.pressedKeys = {}; },
};

// ---------------------------------------------------------------------------
// Entities
// ---------------------------------------------------------------------------
class Entity {
  constructor(sprite, x, y, dir = 'down') {
    this.sprite = Assets.sprites[sprite];
    this.spriteName = sprite;
    this.x = x; this.y = y;          // feet centre, pixels
    this.dir = dir;
    this.frame = 0; this.animT = 0; this.moving = false;
    this.bob = Math.random() * 10;
  }
  get box() { return { x: this.x - 8, y: this.y - 8, w: 16, h: 8 }; }
  draw(ctx, cam) {
    const s = this.sprite;
    const row = s.rows.indexOf(this.dir);
    const fr = this.moving ? this.frame : 0;
    // idle breathing: the whole figure settles 1px for a moment on a slow cycle
    const t = World.t + this.bob;
    const breathe = !this.moving && ((t % 3.1) < 0.45) ? 1 : 0;
    const dx = Math.round(this.x - 16 - cam.x), dy = Math.round(this.y - 46 - cam.y) + breathe;
    ctx.drawImage(s.im, fr * s.fw, row * s.fh, s.fw, s.fh, dx, dy, s.fw, s.fh);
    // blink: cover the eye pixels with skin for a few frames every few seconds
    const eyes = s.eyes && s.eyes[this.dir];
    if (eyes && eyes.length && ((t * 0.37) % 4.3) < 0.12) {
      ctx.fillStyle = `rgb(${s.skin[0]},${s.skin[1]},${s.skin[2]})`;
      for (const [ex, ey] of eyes) ctx.fillRect(dx + ex, dy + ey, 1, 1);
    }
  }
  animate(dt) {
    if (this.moving) {
      this.animT += dt;
      if (this.animT > 0.13) { this.animT = 0; this.frame = (this.frame + 1) % 4; }
    } else { this.frame = 0; this.animT = 0; }
  }
}

class NPC extends Entity {
  constructor(def) {
    super(def.sprite, def.x * TILE + 16, def.y * TILE + 30, def.dir || 'down');
    this.id = def.id; this.def = def; this.homeDir = this.dir;
    this.solid = true;
  }
  get box() { return { x: this.x - 10, y: this.y - 10, w: 20, h: 12 }; }
  face(px, py) {
    const dx = px - this.x, dy = py - this.y;
    this.dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
  }
}

// ---------------------------------------------------------------------------
// World: current room, collision, drawing
// ---------------------------------------------------------------------------
const World = {
  room: null, roomId: null, w: 0, h: 0, ground: [], solids: [], objects: [], npcs: [], exits: [], hotspots: [],
  player: null, cam: { x: 0, y: 0 }, t: 0,

  load(roomId, spawnName) {
    const room = ROOMS[roomId];
    if (!room) throw new Error('no room ' + roomId);
    this.room = room; this.roomId = roomId;
    this.w = room.w * TILE; this.h = room.h * TILE;
    this.solids = []; this.objects = []; this.npcs = []; this.exits = []; this.hotspots = [];
    // ground: expand legend (variant arrays picked deterministically)
    this.ground = [];
    let seed = 7;
    const rnd = () => { seed = (seed * 9301 + 49297) % 233280; return seed / 233280; };
    for (let ty = 0; ty < room.h; ty++) {
      const row = room.ground[ty] || '';
      const out = [];
      for (let tx = 0; tx < room.w; tx++) {
        const ch = row[tx] || room.fill || ' ';
        let name = room.legend[ch];
        if (Array.isArray(name)) name = name[Math.floor(rnd() * name.length)];
        out.push(name || null);
        if (name && Game.solidTile(name)) this.solids.push({ x: tx * TILE, y: ty * TILE, w: TILE, h: TILE });
        if (!name) this.solids.push({ x: tx * TILE, y: ty * TILE, w: TILE, h: TILE });
      }
      this.ground.push(out);
    }
    // objects (atlas tiles)
    for (const o of room.objects || []) {
      if (o.cond && !o.cond(Game.state)) continue;
      const t = Assets.tile(o.t);
      const obj = { kind: 'tile', name: o.t, x: o.x * TILE + (o.dx || 0), y: o.y * TILE + (o.dy || 0), w: t.w, h: t.h, def: o };
      this.objects.push(obj);
      if (o.solid !== false) {
        const sh = o.solidH != null ? o.solidH : Math.min(t.h, 32);
        this.solids.push({ x: obj.x + 2, y: obj.y + t.h - sh + 2, w: t.w - 4, h: sh - 4 });
      }
      if (o.evidence || o.look) this.hotspots.push({ x: obj.x, y: obj.y, w: t.w, h: t.h, def: o });
    }
    // buildings (exterior sprites)
    for (const b of room.buildings || []) {
      const bd = Assets.buildings[b.b];
      const obj = { kind: 'building', name: b.b, x: b.x * TILE, y: b.y * TILE, w: bd.w, h: bd.h, def: b };
      this.objects.push(obj);
      if (bd.door) {
        const [dx, dy, dw, dh] = bd.door;
        // solid everywhere except the door strip
        this.solids.push({ x: obj.x, y: obj.y, w: bd.w, h: bd.h - dh });
        this.solids.push({ x: obj.x, y: obj.y + bd.h - dh, w: dx, h: dh });
        this.solids.push({ x: obj.x + dx + dw, y: obj.y + bd.h - dh, w: bd.w - dx - dw, h: dh });
        if (b.to) {
          this.exits.push({ x: obj.x + dx, y: obj.y + bd.h - dh, w: dw, h: dh, to: b.to, spawn: b.spawn, label: b.label, locked: b.locked });
          // coming back out of this building puts you just below its door
          room.spawns['from_' + b.b] = { x: Math.floor((obj.x + dx + dw / 2) / TILE), y: Math.floor((obj.y + bd.h) / TILE), dir: 'down' };
        }
      } else if (bd.solid) {
        const [sx, sy, sw, sh] = bd.solid;
        this.solids.push({ x: obj.x + sx, y: obj.y + sy, w: sw, h: sh });
      } else {
        this.solids.push({ x: obj.x, y: obj.y, w: bd.w, h: bd.h });
      }
    }
    for (const e of room.exits || []) this.exits.push({ x: e.x * TILE, y: e.y * TILE, w: e.w * TILE, h: e.h * TILE, to: e.to, spawn: e.spawn, label: e.label, locked: e.locked });
    for (const h of room.hotspots || []) this.hotspots.push({ x: h.x * TILE, y: h.y * TILE, w: (h.w || 1) * TILE, h: (h.h || 1) * TILE, def: h });
    for (const n of room.npcs || []) {
      if (n.cond && !n.cond(Game.state)) continue;
      this.npcs.push(new NPC(n));
    }
    // player
    const sp = (room.spawns && room.spawns[spawnName]) || room.spawns.default;
    if (!this.player) this.player = new Entity('player', 0, 0);
    this.player.x = sp.x * TILE + 16; this.player.y = sp.y * TILE + 30; this.player.dir = sp.dir || 'down';
    this.player.moving = false;
    this.updateCamera(true);
    Atmosphere.collect(room);
  },

  // --- collision --------------------------------------------------------
  hit(box, ignoreNpc) {
    if (box.x < 0 || box.y < 0 || box.x + box.w > this.w || box.y + box.h > this.h) return true;
    for (const s of this.solids) if (overlap(box, s)) return true;
    for (const n of this.npcs) if (n !== ignoreNpc && n.solid && overlap(box, n.box)) return true;
    return false;
  },

  movePlayer(dt) {
    const p = this.player;
    const a = Input.axis();
    p.moving = !!(a.x || a.y);
    if (!p.moving) return;
    const speed = 100;
    let dx = a.x * speed * dt, dy = a.y * speed * dt;
    if (a.x && a.y) { dx *= 0.7071; dy *= 0.7071; }
    if (a.x) p.dir = a.x > 0 ? 'right' : 'left';
    if (a.y && !a.x) p.dir = a.y > 0 ? 'down' : 'up';
    else if (a.y && Math.abs(dy) > Math.abs(dx)) p.dir = a.y > 0 ? 'down' : 'up';
    // axis-separated movement so you slide along walls
    let b = p.box; b.x += dx;
    if (!this.hit(b)) p.x += dx;
    b = p.box; b.y += dy;
    if (!this.hit(b)) p.y += dy;
  },

  // what is in front of the player?
  facingPoint(dist = 18) {
    const p = this.player;
    const d = { down: [0, 1], up: [0, -1], left: [-1, 0], right: [1, 0] }[p.dir];
    return { x: p.x + d[0] * dist, y: p.y - 4 + d[1] * dist };
  },
  target() {
    const f = this.facingPoint();
    const probe = { x: f.x - 6, y: f.y - 6, w: 12, h: 12 };
    const live = this.hotspots.filter(h => !(h.def.cond && !h.def.cond(Game.state)) && !(h.def.evidence && Game.state.evidence.includes(h.def.evidence) && !h.def.look));
    // a hotspot directly under the probe wins (so a table in front of someone is still examinable)
    for (const h of live) if (overlap(probe, h)) return { kind: 'hotspot', hotspot: h };
    for (const n of this.npcs) {
      const r = n.def.reach || {};
      const nb = { x: n.x - 18 - (r.l || 0), y: n.y - 34 - (r.u || 0), w: 36 + (r.l || 0) + (r.r || 0), h: 46 + (r.u || 0) + (r.d || 0) };
      if (overlap(probe, nb)) return { kind: 'npc', npc: n };
    }
    for (const h of live) {
      const hb = { x: h.x - 4, y: h.y - 4, w: h.w + 8, h: h.h + 8 };
      if (overlap(probe, hb)) return { kind: 'hotspot', hotspot: h };
    }
    return null;
  },
  exitAt() {
    const b = this.player.box;
    for (const e of this.exits) if (overlap(b, e)) return e;
    return null;
  },

  // --- camera ------------------------------------------------------------
  updateCamera(snap) {
    const p = this.player;
    let cx = p.x - VIEW_W / 2, cy = p.y - 24 - VIEW_H / 2;
    cx = clamp(cx, 0, Math.max(0, this.w - VIEW_W));
    cy = clamp(cy, 0, Math.max(0, this.h - VIEW_H));
    if (this.w < VIEW_W) cx = -(VIEW_W - this.w) / 2;
    if (this.h < VIEW_H) cy = -(VIEW_H - this.h) / 2;
    if (snap) { this.cam.x = cx; this.cam.y = cy; }
    else { this.cam.x += (cx - this.cam.x) * 0.18; this.cam.y += (cy - this.cam.y) * 0.18; }
  },

  update(dt) {
    this.t += dt; this.lastDt = dt;
    this.movePlayer(dt);
    this.player.animate(dt);
    for (const n of this.npcs) n.animate(dt);
    this.updateCamera(false);
  },

  // --- drawing -----------------------------------------------------------
  draw(ctx) {
    const cam = { x: Math.round(this.cam.x), y: Math.round(this.cam.y) };
    // beyond the room: a dark textured void so nothing reads as empty screen
    const voidTile = this.room.outside || (this.room.outdoor ? 'grass_snow1' : 'void');
    for (let vy = -((cam.y % TILE) + TILE) % TILE; vy < VIEW_H; vy += TILE) for (let vx = -((cam.x % TILE) + TILE) % TILE; vx < VIEW_W; vx += TILE) Assets.drawTile(ctx, voidTile, vx, vy);
    if (!this.room.outdoor) { ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(0, 0, VIEW_W, VIEW_H); }
    const tx0 = Math.max(0, Math.floor(cam.x / TILE)), ty0 = Math.max(0, Math.floor(cam.y / TILE));
    const tx1 = Math.min(this.room.w - 1, Math.ceil((cam.x + VIEW_W) / TILE)), ty1 = Math.min(this.room.h - 1, Math.ceil((cam.y + VIEW_H) / TILE));
    for (let ty = ty0; ty <= ty1; ty++) for (let tx = tx0; tx <= tx1; tx++) {
      const n = this.ground[ty][tx];
      if (n) Assets.drawTile(ctx, n, tx * TILE - cam.x, ty * TILE - cam.y);
    }
    // soft shadows under furniture and people
    ctx.fillStyle = 'rgba(10,6,8,0.28)';
    for (const o of this.objects) {
      if (o.def.flat || o.kind === 'building' || (o.def.solid === false && !o.def.shadow)) continue;
      const sx = o.x + o.w / 2 - cam.x, sy = o.y + o.h - 2 - cam.y;
      ctx.beginPath(); ctx.ellipse(sx, sy, o.w / 2 + 2, 5, 0, 0, Math.PI * 2); ctx.fill();
    }
    for (const e of [this.player, ...this.npcs]) {
      ctx.beginPath(); ctx.ellipse(e.x - cam.x, e.y - 1 - cam.y, 9, 4, 0, 0, Math.PI * 2); ctx.fill();
    }
    // depth sort: objects by bottom edge, entities by feet
    const list = [];
    for (const o of this.objects) {
      if (o.def.flat) { this.drawObject(ctx, o, cam); continue; }
      list.push({ y: o.y + o.h - (o.def.sortBias || 0), draw: () => this.drawObject(ctx, o, cam) });
    }
    for (const n of this.npcs) list.push({ y: n.y, draw: () => n.draw(ctx, cam) });
    list.push({ y: this.player.y, draw: () => this.player.draw(ctx, cam) });
    list.sort((a, b) => a.y - b.y);
    for (const it of list) it.draw();
    // markers over NPCs with something new
    for (const n of this.npcs) {
      if (Game.npcHasNew(n)) {
        const bob = Math.round(Math.sin(this.t * 4 + n.bob) * 2);
        ctx.drawImage(Assets.ui.bang, Math.round(n.x - 8 - cam.x), Math.round(n.y - 66 - cam.y + bob), 16, 16);
      }
    }
    for (const h of this.hotspots) {
      if (h.def.cond && !h.def.cond(Game.state)) continue;
      if (h.def.evidence && !Game.state.evidence.includes(h.def.evidence)) {
        const bob = Math.round(Math.sin(this.t * 3 + h.x) * 1.5);
        ctx.drawImage(Assets.ui.spark, Math.round(h.x + h.w / 2 - 8 - cam.x), Math.round(h.y - 10 - cam.y + bob), 16, 16);
      }
    }
    // interaction arrow
    const t = this.target();
    if (t && !Game.busy) {
      const p = t.kind === 'npc' ? { x: t.npc.x, y: t.npc.y - 66 } : { x: t.hotspot.x + t.hotspot.w / 2, y: t.hotspot.y - 14 };
      const bob = Math.round(Math.sin(this.t * 6) * 2);
      ctx.drawImage(Assets.ui.arrow, Math.round(p.x - 8 - cam.x), Math.round(p.y - cam.y + bob), 16, 16);
    }
    // lighting, smoke, breath, snow
    Atmosphere.draw(ctx, cam, this.lastDt || 0.016);
  },
  drawObject(ctx, o, cam) {
    if (o.kind === 'tile') Assets.drawTile(ctx, o.name, o.x - cam.x, o.y - cam.y);
    else ctx.drawImage(Assets.buildings[o.name].im, o.x - cam.x, o.y - cam.y);
  },
  drawSnow(ctx, cam) {
    ctx.fillStyle = 'rgba(230,232,240,0.7)';
    for (let i = 0; i < 40; i++) {
      const x = ((i * 137 + this.t * (18 + i % 7)) % (VIEW_W + 40)) - 20 - (cam.x * 0.2 % 40);
      const y = ((i * 89 + this.t * (28 + i % 5)) % (VIEW_H + 20)) - 10;
      ctx.fillRect(Math.round(x), Math.round(y), 2, 2);
    }
  },
};

function overlap(a, b) { return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ---------------------------------------------------------------------------
// Stage scaling
// ---------------------------------------------------------------------------
function fitStage() {
  // Pick the largest integer scale that fits a 640x360 design frame, then widen/heighten the
  // view to cover the whole window at that scale so there are no black margins.
  const raw = Math.min(window.innerWidth / 640, window.innerHeight / 360);
  const s = raw >= 1 ? Math.floor(raw) : Math.max(0.3, raw);
  VIEW_W = Math.ceil(window.innerWidth / s);
  VIEW_H = Math.ceil(window.innerHeight / s);
  const canvas = document.getElementById('game');
  if (canvas.width !== VIEW_W || canvas.height !== VIEW_H) {
    canvas.width = VIEW_W; canvas.height = VIEW_H;
    canvas.getContext('2d').imageSmoothingEnabled = false;
  }
  for (const id of ['stage', 'game', 'overlay']) {
    const el = document.getElementById(id);
    el.style.width = VIEW_W + 'px'; el.style.height = VIEW_H + 'px';
  }
  const stage = document.getElementById('stage');
  stage.style.transform = `scale(${s})`;
  stage.style.left = '0px'; stage.style.top = '0px';
  window.STAGE_SCALE = s;
  if (window.Atmosphere && Atmosphere.lm) Atmosphere.resize();
  if (window.World && World.room) World.updateCamera(true);
}
window.addEventListener('resize', fitStage);


// ---- src/atmosphere.js ----
/* Atmosphere: a light map multiplied over the scene, glow bloom from light sources,
   chimney smoke, breath in cold air, and snow in two depths. Canvas 2D only. */
'use strict';

const Atmosphere = {
  lights: [], smoke: [], particles: [], patches: [], lm: null, glow: null, t: 0,
  // ambient tints (multiplied over the scene). Warm interiors, a cold blue dusk outside.
  ambient: {
    outdoor: [140, 150, 196],
    indoor: [222, 208, 192],
    dim: [176, 160, 158],
  },
  KIND: {
    window: { color: [255, 214, 150], flicker: 0.05 },
    lamp: { color: [255, 226, 170], flicker: 0.08 },
    fire: { color: [255, 170, 90], flicker: 0.22 },
    candle: { color: [255, 210, 140], flicker: 0.18 },
    daylight: { color: [200, 214, 240], flicker: 0 },
  },

  init() {
    this.lm = document.createElement('canvas');
    this.glow = document.createElement('canvas');
    this.resize();
  },
  resize() {
    this.lm.width = VIEW_W; this.lm.height = VIEW_H;
    this.glow.width = VIEW_W; this.glow.height = VIEW_H;
  },

  // Called by World.load: gather light sources and smoke points from the room.
  collect(room) {
    this.lights = []; this.smoke = []; this.particles = []; this.patches = [];
    for (const o of World.objects) {
      if (o.kind === 'building') {
        const bd = Assets.buildings[o.name];
        // window glow is pushed a little downward so it pools on the ground instead of bleaching the wall
        for (const [x, y, r, kind] of (bd.lights || [])) this.lights.push({ x: o.x + x, y: o.y + y + (kind === 'window' ? 14 : 0), r, kind, seed: Math.random() * 100, gain: kind === 'window' ? 0.55 : 1 });
        for (const [x, y] of (bd.smoke || [])) this.smoke.push({ x: o.x + x, y: o.y + y, seed: Math.random() * 100 });
      } else {
        const n = o.name;
        if (n === 'fireplace') this.lights.push({ x: o.x + 32, y: o.y + 22, r: 120, kind: 'fire', seed: Math.random() * 100 });
        else if (n === 'candle_table') this.lights.push({ x: o.x + 15, y: o.y + 8, r: 52, kind: 'candle', seed: Math.random() * 100 });
        else if (n === 'stove') this.lights.push({ x: o.x + 16, y: o.y + 16, r: 70, kind: 'fire', seed: Math.random() * 100 });
        else if (n === 'argand_lamp') this.lights.push({ x: o.x + 16, y: o.y + 6, r: 88, kind: 'lamp', seed: Math.random() * 100 });
        else if (n === 'sconce') this.lights.push({ x: o.x + 16, y: o.y + 12, r: 64, kind: 'candle', seed: Math.random() * 100 });
        else if (n === 'desk2' || n === 'desk3') this.lights.push({ x: o.x + o.w - 10, y: o.y + 14, r: 46, kind: 'candle', seed: Math.random() * 100 });
      }
    }
    // interior windows let in cold daylight; wall lamps would go here too
    for (let ty = 0; ty < room.h; ty++) for (let tx = 0; tx < room.w; tx++) {
      const n = World.ground[ty][tx];
      if (n && n.endsWith('_win')) { this.lights.push({ x: tx * TILE + 16, y: ty * TILE + 12, r: 90, kind: 'daylight', seed: 0 }); this.patches.push({ x: tx * TILE, y: (ty + 1) * TILE }); }
    }
    for (const l of (room.lights || [])) this.lights.push({ x: l.x * TILE + 16, y: l.y * TILE + 16, r: l.r || 80, kind: l.kind || 'lamp', seed: Math.random() * 100 });
    // interiors get a soft central fill so rooms without fires aren't gloomy
    if (!room.outdoor) this.lights.push({ x: room.w * TILE / 2, y: room.h * TILE / 2, r: Math.max(room.w, room.h) * TILE * 0.75, kind: 'daylight', seed: 0, soft: true });
  },

  flick(l, t) {
    const k = this.KIND[l.kind];
    if (!k.flicker) return 1;
    return 1 - k.flicker * (0.5 + 0.5 * Math.sin(t * 13 + l.seed) * Math.sin(t * 7.3 + l.seed * 2));
  },

  draw(ctx, cam, dt) {
    this.t += dt;
    const room = World.room;
    const amb = room.ambient || (room.outdoor ? this.ambient.outdoor : room.dim ? this.ambient.dim : this.ambient.indoor);
    const lc = this.lm.getContext('2d');
    lc.globalCompositeOperation = 'source-over';
    lc.fillStyle = `rgb(${amb[0]},${amb[1]},${amb[2]})`;
    lc.fillRect(0, 0, VIEW_W, VIEW_H);
    lc.globalCompositeOperation = 'lighter';
    const gc = this.glow.getContext('2d');
    gc.globalCompositeOperation = 'source-over';
    gc.clearRect(0, 0, VIEW_W, VIEW_H);
    gc.globalCompositeOperation = 'lighter';
    for (const l of this.lights) {
      const x = l.x - cam.x, y = l.y - cam.y;
      if (x < -l.r || y < -l.r || x > VIEW_W + l.r || y > VIEW_H + l.r) continue;
      const k = this.KIND[l.kind];
      const f = this.flick(l, this.t);
      const r = l.r * (0.92 + 0.08 * f);
      const [cr, cg, cb] = k.color;
      // brightness contribution (multiply map): light lifts the ambient toward its colour
      const g = lc.createRadialGradient(x, y, 0, x, y, r);
      const a = (l.soft ? 0.35 : 0.9) * (l.gain || 1);
      g.addColorStop(0, `rgba(${cr},${cg},${cb},${(a * f).toFixed(3)})`);
      g.addColorStop(0.35, `rgba(${cr},${cg},${cb},${(a * 0.55 * f).toFixed(3)})`);
      g.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
      lc.fillStyle = g; lc.fillRect(x - r, y - r, r * 2, r * 2);
      // bloom (screen-added, small and soft)
      if (!l.soft && l.kind !== 'daylight') {
        const rg = r * 0.5;
        const g2 = gc.createRadialGradient(x, y, 0, x, y, rg);
        g2.addColorStop(0, `rgba(${cr},${cg},${cb},${(0.28 * f).toFixed(3)})`);
        g2.addColorStop(1, `rgba(${cr},${cg},${cb},0)`);
        gc.fillStyle = g2; gc.fillRect(x - rg, y - rg, rg * 2, rg * 2);
      }
    }
    // daylight through the windows lands on the floor
    for (const p of this.patches) {
      const x = p.x - cam.x, y = p.y - cam.y;
      if (x < -120 || x > VIEW_W + 60 || y < -20 || y > VIEW_H + 120) continue;
      const g = lc.createLinearGradient(0, y, 0, y + 110);
      g.addColorStop(0, 'rgba(210,222,245,0.55)'); g.addColorStop(1, 'rgba(210,222,245,0)');
      lc.fillStyle = g;
      lc.beginPath(); lc.moveTo(x + 4, y); lc.lineTo(x + 28, y); lc.lineTo(x + 46, y + 110); lc.lineTo(x - 14, y + 110); lc.closePath(); lc.fill();
    }
    ctx.save();
    ctx.globalCompositeOperation = 'multiply';
    ctx.drawImage(this.lm, 0, 0);
    ctx.globalCompositeOperation = 'screen';
    ctx.drawImage(this.glow, 0, 0);
    ctx.restore();
    // vignette on exteriors
    if (room.outdoor) {
      const v = ctx.createRadialGradient(VIEW_W / 2, VIEW_H / 2, 180, VIEW_W / 2, VIEW_H / 2, 460);
      v.addColorStop(0, 'rgba(10,12,30,0)'); v.addColorStop(1, 'rgba(10,12,30,0.4)');
      ctx.fillStyle = v; ctx.fillRect(0, 0, VIEW_W, VIEW_H);
    }
    this.drawParticles(ctx, cam, dt);
  },

  drawParticles(ctx, cam, dt) {
    const room = World.room;
    // chimney smoke: spawn a puff every so often per chimney
    for (const s of this.smoke) {
      if (Math.random() < dt * 2.2) this.particles.push({ kind: 'smoke', x: s.x + (Math.random() - 0.5) * 4, y: s.y, vx: 6 + Math.random() * 6, vy: -14 - Math.random() * 8, life: 0, max: 3 + Math.random() * 2, size: 2 });
    }
    // breath from the player and NPCs outdoors
    if (room.outdoor) {
      const who = [World.player, ...World.npcs];
      for (const e of who) if (Math.random() < dt * 0.35) this.particles.push({ kind: 'breath', x: e.x + (e.dir === 'left' ? -6 : e.dir === 'right' ? 6 : 0), y: e.y - 30, vx: (e.dir === 'left' ? -8 : e.dir === 'right' ? 8 : 0), vy: -6, life: 0, max: 1.1, size: 1.5 });
    }
    for (const p of this.particles) {
      p.life += dt; p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.kind === 'smoke') { p.vx *= 0.995; p.size += dt * 2.4; }
      else p.size += dt * 3;
    }
    this.particles = this.particles.filter(p => p.life < p.max);
    for (const p of this.particles) {
      const k = 1 - p.life / p.max;
      const a = p.kind === 'smoke' ? 0.28 * k : 0.35 * k;
      ctx.fillStyle = `rgba(226,224,232,${a.toFixed(3)})`;
      const sz = Math.max(1, Math.round(p.size));
      ctx.fillRect(Math.round(p.x - cam.x - sz / 2), Math.round(p.y - cam.y - sz / 2), sz, sz);
      if (sz > 3) ctx.fillRect(Math.round(p.x - cam.x - sz / 2) + 1, Math.round(p.y - cam.y - sz / 2) - 1, sz - 2, 1);
    }
    if (room.fx === 'snow') this.drawSnow(ctx, cam);
  },

  drawSnow(ctx, cam) {
    const t = this.t;
    // far layer: small, slow, dim
    ctx.fillStyle = 'rgba(226,230,240,0.45)';
    for (let i = 0; i < 70; i++) {
      const x = ((i * 137 + t * (10 + i % 5) + Math.sin(t * 0.8 + i) * 6) % (VIEW_W + 40)) - 20 - ((cam.x * 0.15) % 40);
      const y = ((i * 89 + t * (18 + i % 7)) % (VIEW_H + 20)) - 10;
      ctx.fillRect(Math.round(x), Math.round(y), 1, 1);
    }
    // near layer: bigger, faster, drifting
    ctx.fillStyle = 'rgba(236,238,246,0.8)';
    for (let i = 0; i < 26; i++) {
      const x = ((i * 211 + t * (26 + i % 6) + Math.sin(t * 1.3 + i * 2) * 14) % (VIEW_W + 60)) - 30 - ((cam.x * 0.4) % 60);
      const y = ((i * 149 + t * (44 + i % 9)) % (VIEW_H + 30)) - 15;
      ctx.fillRect(Math.round(x), Math.round(y), 2, 2);
    }
  },
};


// ---- src/ui.js ----
/* DOM layer: dialogue box, evidence tray, card pop-ups, HUD, toasts, fullscreen scenes. */
'use strict';

const $ = (sel) => document.querySelector(sel);

const UI = {
  init() {
    $('#tray-close').onclick = () => UI.Tray.close();
    $('#evidence-btn').onclick = () => { if (!Game.busy) UI.Tray.open(); };
    $('#help-btn').onclick = () => { if (!Game.busy) Scenes.help(); };
    $('#card-pop').onclick = () => UI.Card._resolve && UI.Card._resolve();
    this.buildHud();
  },

  // ---- HUD -------------------------------------------------------------
  buildHud() {
    const box = $('#suspects');
    box.innerHTML = '';
    for (const s of SUSPECTS) {
      const d = document.createElement('div');
      d.className = 'sus'; d.dataset.id = s.id; d.title = s.name;
      const im = document.createElement('img'); im.src = Assets.url(`assets/portraits/${s.portrait}.png`); im.className = 'px';
      d.appendChild(im);
      box.appendChild(d);
    }
    this.updateHud();
  },
  updateHud() {
    for (const el of document.querySelectorAll('#suspects .sus')) {
      el.classList.toggle('done', Game.state.interviewed.includes(el.dataset.id));
    }
    $('#evidence-count').textContent = Game.state.evidence.length;
  },
  flashEvidence() {
    const b = $('#evidence-btn'); b.classList.remove('flash'); void b.offsetWidth; b.classList.add('flash');
  },

  // ---- toasts / banners --------------------------------------------------
  toast(msg, ms = 2200) {
    const t = $('#toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(this._toastT); this._toastT = setTimeout(() => t.classList.remove('show'), ms);
  },
  banner(name) {
    const b = $('#location-banner'); b.textContent = name; b.classList.add('show');
    clearTimeout(this._bannerT); this._bannerT = setTimeout(() => b.classList.remove('show'), 2200);
  },

  // ---- glossary markup ---------------------------------------------------
  // "[tariff]" -> underlined term with a hover definition; "[tariffs|tariff]" shows the first word, defines the second.
  markup(text) {
    return text
      .replace(/\[([^\]|]+)(?:\|([^\]]+))?\]/g, (m, shown, key) => {
        const k = (key || shown).toLowerCase();
        const def = GLOSSARY[k];
        if (!def) return shown;
        return `<span class="term" data-def="${def.replace(/"/g, '&quot;')}">${shown}</span>`;
      })
      .replace(/\*([^*]+)\*/g, '<i>$1</i>');
  },

  // ---- fullscreen scenes -------------------------------------------------
  screen(html) {
    const f = $('#fullscreen'); f.innerHTML = html; f.classList.remove('hidden'); return f;
  },
  closeScreen() { $('#fullscreen').classList.add('hidden'); $('#fullscreen').innerHTML = ''; },
  wait(ms) { return new Promise(r => setTimeout(r, ms)); },
  // resolves on click anywhere in element or Space/Enter
  clickOrKey(el) {
    return new Promise(res => {
      const done = () => { el.removeEventListener('click', done); window.removeEventListener('keydown', kd); res(); };
      const kd = (e) => { if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); done(); } };
      el.addEventListener('click', done);
      setTimeout(() => window.addEventListener('keydown', kd), 50);
    });
  },
};

// ---------------------------------------------------------------------------
// Dialogue runner
// ---------------------------------------------------------------------------
UI.Dialogue = {
  el: null, typing: false, _skip: null, _advance: null,
  init() {
    this.el = $('#dialogue');
    this.el.addEventListener('click', (e) => {
      if (e.target.classList.contains('term')) { const was = e.target.classList.contains('open'); for (const t of this.el.querySelectorAll('.term.open')) t.classList.remove('open'); if (!was) e.target.classList.add('open'); return; }
      if (e.target.tagName !== 'BUTTON') this.tap();
    });
    window.addEventListener('keydown', (e) => {
      if (this.el.classList.contains('hidden')) return;
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); this.tap(); }
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= 9) {
        const btns = $('#dlg-choices').querySelectorAll('button');
        if (btns[n - 1]) btns[n - 1].click();
      }
    });
  },
  tap() {
    if (this.typing && this._skip) this._skip();
    else if (this._advance) this._advance();
  },

  setSpeaker(name, portrait) {
    $('#dlg-name').textContent = name || '';
    const p = $('#dlg-portrait');
    p.innerHTML = ''; p.className = '';
    if (portrait === 'player') { p.appendChild(UI.playerPortrait()); }
    else if (portrait) { const im = document.createElement('img'); im.src = Assets.url(`assets/portraits/${portrait}.png`); p.appendChild(im); }
    else { p.style.visibility = 'hidden'; return; }
    p.style.visibility = 'visible';
  },

  // typewriter one page of text; resolves when the player advances
  async page(text) {
    const box = $('#dlg-text');
    const html = UI.markup(text);
    $('#dlg-choices').innerHTML = '';
    $('#dlg-hint').classList.remove('hidden');
    // type out plain characters while keeping tags intact
    box.innerHTML = html;
    const full = box.innerHTML;
    const nodes = [];
    const walk = (n) => { for (const c of n.childNodes) { if (c.nodeType === 3) nodes.push(c); else walk(c); } };
    walk(box);
    const texts = nodes.map(n => n.nodeValue);
    nodes.forEach(n => n.nodeValue = '');
    this.typing = true;
    await new Promise(res => {
      let i = 0, j = 0;
      const step = () => {
        if (!this.typing) { nodes.forEach((n, k) => n.nodeValue = texts[k]); res(); return; }
        let budget = 2;
        while (budget-- > 0) {
          if (i >= nodes.length) { this.typing = false; res(); return; }
          if (j < texts[i].length) { nodes[i].nodeValue += texts[i][j++]; }
          else { i++; j = 0; }
        }
        this._timer = setTimeout(step, 16);
      };
      this._skip = () => { this.typing = false; clearTimeout(this._timer); nodes.forEach((n, k) => n.nodeValue = texts[k]); res(); };
      step();
    });
    this._skip = null; this.typing = false;
    await new Promise(res => { this._advance = res; });
    this._advance = null;
  },

  async choose(options) {
    $('#dlg-hint').classList.add('hidden');
    const box = $('#dlg-choices'); box.innerHTML = '';
    return new Promise(res => {
      options.forEach((o, i) => {
        const b = document.createElement('button');
        b.innerHTML = UI.markup(o.label);
        if (o.cls) b.className = o.cls;
        b.onclick = (e) => { e.stopPropagation(); box.innerHTML = ''; res(o); };
        box.appendChild(b);
      });
    });
  },

  show() { this.el.classList.remove('hidden'); },
  hide() { this.el.classList.add('hidden'); this._advance = null; this._skip = null; },

  /* Run a dialogue definition. def = { name, portrait, start(S)->id, nodes:{...}, onEvidence:{...} } */
  async run(def, ctx = {}) {
    const S = Game.state;
    this.show();
    let id = typeof def.start === 'function' ? def.start(S, ctx) : (def.start || 'start');
    let guard = 0;
    while (id && id !== 'END' && guard++ < 200) {
      const node = def.nodes[id];
      if (!node) { console.warn('missing node', id); break; }
      S.seen[def.id] = S.seen[def.id] || {}; S.seen[def.id][id] = true;
      const speaker = node.speaker !== undefined ? node.speaker : def.name;
      const portrait = node.portrait !== undefined ? node.portrait : def.portrait;
      this.setSpeaker(speaker, portrait);
      let text = typeof node.text === 'function' ? node.text(S, ctx) : node.text;
      if (text && !Array.isArray(text)) text = [text];
      for (const t of (text || [])) {
        if (t.startsWith('@')) { // "@speaker|portrait: text" inline speaker switch
          const m = t.match(/^@([^|:]*)\|?([^:]*):\s*(.*)$/s);
          if (m) { this.setSpeaker(m[1], m[2] || null); await this.page(m[3]); this.setSpeaker(speaker, portrait); continue; }
        }
        await this.page(t);
      }
      if (node.set) for (const k of Object.keys(node.set)) S.flags[k] = node.set[k];
      if (node.fn) node.fn(S, ctx);
      if (node.interviewed) Game.markInterviewed(node.interviewed);
      if (node.give) {
        for (const g of [].concat(node.give)) await Game.collect(g, node.where || def.name);
      }
      if (node.choices || node.evidence || node.leave) {
        let next = null;
        while (next === null) {
          let opts = (typeof node.choices === 'function' ? node.choices(S, ctx) : node.choices) || [];
          opts = opts.filter(o => !o.cond || o.cond(S, ctx));
          if (node.evidence !== false && (node.evidence || def.onEvidence) && S.evidence.length) opts.push({ label: 'Show them something…', cls: 'evidence', ev: true });
          if (node.leave !== false) opts.push({ label: node.leaveLabel || "That's all for now.", cls: 'leave', next: 'END' });
          const pick = await this.choose(opts);
          if (pick.ev) {
            const item = await UI.Tray.pick();
            if (!item) continue;                       // tray cancelled: same menu again
            S.shown[def.id] = S.shown[def.id] || {}; S.shown[def.id][item] = true;
            let target = def.onEvidence && (def.onEvidence[item] || def.onEvidence._default);
            if (typeof target === 'function') target = target(S, item, ctx);
            if (target) { next = target; break; }
            this.setSpeaker(speaker, portrait);          // generic brush-off, then the menu again
            await this.page(def.brushOff || "I've no idea what that is. Put it away.");
            continue;
          }
          if (pick.set) for (const k of Object.keys(pick.set)) S.flags[k] = pick.set[k];
          if (pick.fn) pick.fn(S, ctx);
          next = typeof pick.next === 'function' ? pick.next(S, ctx) : pick.next;
        }
        id = next;
        continue;
      }
      id = typeof node.next === 'function' ? node.next(S, ctx) : node.next;
    }
    this.hide();
    Game.save();
  },
};

// player mini-portrait: the sprite's head, blown up

    for (let i = 0; i < EVIDENCE_ORDER.length; i++) {

  close() { $('#tray').classList.add('hidden'); Game.modal = false; if (this._pick) { const p = this._pick; this._pick = null; p(null); } },

UI.Card = {

    pop.querySelector('.card-desc').innerHTML = UI.markup(e.desc);

    return new Promise(res => {

      setTimeout(() => { this._resolve = done; window.addEventListener('keydown', kd); }, 300);
    });
  },
};

/* Fullscreen DOM scenes: title, opening, briefing, trial, epilogue, help. */

  // A pixel backdrop built from a building sprite, tiled ground and falling snow.
  backdrop(building, opts = {}) {
    const bd = Assets.buildings[building];
    const W = VIEW_W, H = VIEW_H;
    const c = document.createElement('canvas'); c.width = W; c.height = H; c.className = 'bg';
    const ctx = c.getContext('2d'); ctx.imageSmoothingEnabled = false;
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#1a1c2c'); g.addColorStop(1, '#3a3446');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    const scale = opts.scale || 2;
    const w = bd.w * scale, h = bd.h * scale;
    const x = Math.round((W - w) / 2), y = opts.y != null ? opts.y + Math.round((H - 360) / 2) : Math.round(H - h - 40);
    for (let tx = 0; tx < W; tx += 64) for (let ty = y + h - 60; ty < H; ty += 64) {
      const t = Assets.tile(tx % 128 ? 'flag0' : 'flag1');
      ctx.drawImage(Assets.atlas, t.x, t.y, 32, 32, tx, ty, 64, 64);
    }
    ctx.drawImage(bd.im, x, y, w, h);
    ctx.fillStyle = 'rgba(230,232,240,0.6)';
    for (let i = 0; i < 90 * (W * H) / 230400; i++) ctx.fillRect((i * 173) % W, (i * 97) % H, 2, 2);
    ctx.fillStyle = 'rgba(10,8,14,0.35)'; ctx.fillRect(0, 0, W, H);

  async briefing() {

    // magistrate's introduction
    await this.textCards(sc, [
      `<div style="display:flex;gap:12px;align-items:flex-start"><img class="px" src="${Assets.url(`assets/portraits/magistrate.png`)}" style="width:96px;height:96px;border:2px solid #6a5636"><div><b style="color:#d0a448">The Magistrate</b><br>"Sit down. Lawrence fired the pistols; two hundred people saw him. That part is settled. What is <i>not</i> settled is whether anybody put him up to it."</div></div>`,
      `<div style="display:flex;gap:12px;align-items:flex-start"><img class="px" src="${Assets.url(`assets/portraits/magistrate.png`)}" style="width:96px;height:96px;border:2px solid #6a5636"><div><b style="color:#d0a448">The Magistrate</b><br>"The President says it was the Bank. The Whigs say it was the President's own tyranny. Here is my difficulty: in six years this man has made more enemies than any president in the history of the country. I have five files. Read them."</div></div>`,
    ]);
    // dossiers
    const read = new Set();
    const wrap = document.createElement('div'); wrap.className = 'dossiers';
    const list = document.createElement('div'); list.className = 'dossier-list';
    const doss = document.createElement('div'); doss.className = 'dossier';
    wrap.appendChild(list); wrap.appendChild(doss); sc.appendChild(wrap);
    const done = document.createElement('button'); done.className = 'btn small'; done.textContent = 'Begin the investigation'; done.disabled = true;
    done.style.marginTop = 'auto';
    list.appendChild(done);
    const show = (s) => {

      doss.innerHTML = `<img class="big" src="${Assets.url(`assets/portraits/${s.portrait}.png`)}"><div class="body"><h3>${s.name}</h3><div class="meta">${s.title}<br>${s.born} · ${s.where}</div>${s.dossier.map(p => `<p style="margin:0 0 5px">${UI.markup(p)}</p>`).join('')}<div class="grudge">${UI.markup(s.grudge)}</div></div><div class="stamp">${s.topic}</div>`;

    for (const s of SUSPECTS) {
